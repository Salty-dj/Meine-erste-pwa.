name: TSV Vereinsmanager – checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tsv
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          POSTGRES_DB: tsv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tsv -d tsv_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://tsv:ci-only-not-a-production-secret@localhost:5432/tsv_test?schema=public
      TEST_DATABASE_URL: postgresql://tsv:ci-only-not-a-production-secret@localhost:5432/tsv_test?schema=public
      APP_URL: http://localhost:3000
      SESSION_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
