<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#123f94" />
    <title>Offline · TSV Vereinsmanager</title>
    <style>
      body {
        margin: 0;
        background: #f5f7fb;
        color: #193659;
        font:
          16px/1.8 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        display: grid;
        place-items: center;
        min-height: 100dvh;
      }
      main {
        max-width: 420px;
        padding: 30px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.2;
      }
      a {
        display: inline-block;
        background: #1649a5;
        color: white;
        text-decoration: none;
        padding: 11px 20px;
        border-radius: 8px;
        margin-top: 15px;
      }
      p {
        color: #7f93ae;
      }
      small {
        font-size: 12px;
        color: #8297b2;
      }
    </style>
  </head>
  <body>
    <main>
      <small>TSV DENKENDORF · HANDBALL</small>
      <h1>Du bist gerade offline.</h1>
      <p>
        Für deinen geschützten Vereinsbereich ist eine Internetverbindung
        erforderlich. Persönliche Vereinsdaten werden nicht im Offline-Cache
        gespeichert.
      </p>
      <a href="/">Erneut verbinden</a>
    </main>
  </body>
</html>
